<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HL7 Interface Javascript Builder</title>
<style>
:root{
  --bg:#282a36; --bg2:#21222c; --bg3:#1e1f29; --bg4:#343746; --line:#44475a;
  --fg:#f8f8f2; --dim:#6272a4; --cyan:#8be9fd; --green:#50fa7b;
  --orange:#ffb86c; --pink:#ff79c6; --purple:#bd93f9; --red:#ff5555; --yellow:#f1fa8c;
  --r:7px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
  font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- chrome ---------- */
header{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--bg2);
  border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{margin:0;font-size:14px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
header h1 span{color:var(--purple)}
.badge{font-size:10px;padding:2px 7px;border-radius:10px;background:var(--bg3);
  color:var(--dim);border:1px solid var(--line);white-space:nowrap}
.spacer{flex:1}
button{background:var(--bg3);border:1px solid var(--line);color:var(--fg);
  padding:5px 11px;border-radius:6px;cursor:pointer;transition:.12s;white-space:nowrap}
button:hover{border-color:var(--purple);color:var(--purple);background:var(--bg4)}
button.primary{background:var(--purple);border-color:var(--purple);color:#21222c;font-weight:600}
button.primary:hover{background:var(--pink);border-color:var(--pink);color:#21222c}
button.ghost{background:transparent}
button.sm{padding:2px 7px;font-size:11px;border-radius:5px}
button.icon{padding:2px 6px;font-size:12px;line-height:1.2;background:transparent;border-color:transparent;color:var(--dim)}
button.icon:hover{background:var(--bg4);color:var(--fg)}
button.danger:hover{border-color:var(--red);color:var(--red)}
select,input[type=text],textarea{background:var(--bg3);border:1px solid var(--line);
  border-radius:6px;padding:4px 7px;outline:none;min-width:0}
select:focus,input:focus,textarea:focus{border-color:var(--purple)}
select{cursor:pointer}
textarea{resize:none;width:100%;font:inherit;line-height:1.6}
.kbd{display:inline-block;padding:0 5px;border:1px solid var(--line);border-radius:4px;
  background:var(--bg3);color:var(--dim);font-size:11px}

#main{display:grid;grid-template-columns:minmax(290px,1fr) minmax(400px,1.3fr) minmax(340px,1.1fr);
  height:calc(100vh - 45px)}
.col{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line);overflow:hidden}
.col:last-child{border-right:0}
.colhead{display:flex;align-items:center;gap:8px;padding:7px 11px;background:var(--bg2);
  border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;
  letter-spacing:.6px;color:var(--dim);flex:0 0 auto}
.colhead b{color:var(--cyan);font-weight:600}
.subbar{display:flex;align-items:center;gap:6px;padding:6px 9px;background:var(--bg3);
  border-bottom:1px solid var(--line);flex:0 0 auto}
.subbar input[type=text]{flex:1;font-size:12px}
.colbody{flex:1;overflow:auto;min-height:0}
.chk{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:11px;cursor:pointer;white-space:nowrap}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  #main{grid-template-columns:minmax(260px,1fr) minmax(330px,1.15fr);
        grid-template-rows:minmax(0,1.05fr) minmax(0,.95fr)}
  #main > .col:nth-child(2){border-right:0}
  #main > .col:nth-child(3){grid-column:1 / -1;border-top:1px solid var(--line)}
}
@media (max-width:780px){
  #main{grid-template-columns:1fr;grid-template-rows:minmax(220px,.9fr) minmax(240px,1fr) minmax(240px,1fr)}
  #main > .col{border-right:0;border-bottom:1px solid var(--line)}
  .slots{grid-template-columns:1fr;gap:4px}
  .arrowcell{transform:rotate(90deg);height:14px}
}

/* ---------- message tree ---------- */
.segbar{display:flex;align-items:center;gap:7px;padding:4px 11px;cursor:pointer;
  background:var(--bg3);border-left:3px solid var(--purple);position:sticky;top:0;z-index:2}
.segbar:hover{background:var(--bg4)}
.segbar .nm{color:var(--purple);font-weight:600}
.segbar .desc{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.segbar .caret{color:var(--dim);width:9px;flex:0 0 9px}
.node{display:flex;align-items:center;gap:8px;padding:2px 10px 2px 0;cursor:grab;
  border-left:3px solid transparent}
.node:hover{background:var(--bg4);border-left-color:var(--cyan)}
.node:active{cursor:grabbing}
.node .path{color:var(--cyan);flex:0 0 104px;text-align:right;font-size:11.5px}
.node.comp .path{color:var(--green);opacity:.9}
.node .lbl{color:var(--dim);font-size:11px;flex:0 0 120px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.node .val{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.node .val:empty::after{content:'\2014';color:var(--line)}
.node.picked{background:rgba(80,250,123,.14);border-left-color:var(--green)}
.node.dragging{opacity:.4}
body.dnd .node{border-left-color:rgba(255,184,108,.25)}
body.dnd .node.over{background:rgba(255,184,108,.2);border-left-color:var(--orange);
  outline:1px dashed var(--orange);outline-offset:-2px}

/* ---------- mapping cards ---------- */
#rules{padding:10px 11px}
.rule{border:1px solid var(--line);border-radius:var(--r);margin:0 0 9px;background:var(--bg3);
  overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.rule.off{opacity:.45}
.rule.rdrag{opacity:.35}
.rule.rover{border-color:var(--purple);box-shadow:0 0 0 1px var(--purple)}
.rulehead{display:flex;align-items:center;gap:7px;padding:5px 8px;background:var(--bg2);
  border-bottom:1px solid var(--line)}
.grip{cursor:grab;color:var(--dim);letter-spacing:-1px;user-select:none}
.grip:active{cursor:grabbing}
.rulehead .n{color:var(--dim);font-size:11px;min-width:12px}
.rulehead .ttl{flex:1;color:var(--yellow);font-size:11.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.rulebody{padding:9px}
.slots{display:grid;grid-template-columns:1fr 20px 1fr;gap:6px;align-items:stretch}
.slot{border:1px solid var(--line);border-radius:6px;background:var(--bg2);padding:6px;
  display:flex;flex-direction:column;gap:5px;min-width:0}
.slot .cap{font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--dim)}
.slot.src .cap{color:var(--cyan)}
.slot.tgt .cap{color:var(--orange)}
.slot .line{display:flex;gap:5px;align-items:center;min-width:0}
.slot select{flex:1;min-width:0;font-size:12px}
.slot input[type=text]{flex:1;min-width:0}
.slot .meta{font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:14px}
.pathin{color:var(--cyan)}
.pathin.tgt{color:var(--orange)}
.arrowcell{display:flex;align-items:center;justify-content:center;color:var(--pink);font-size:15px}
body.dnd .slot{border-style:dashed;border-color:var(--dim)}
body.dnd .slot.over{border-color:var(--green);background:rgba(80,250,123,.12)}
.dz{margin:2px 0 10px;padding:14px;border:2px dashed var(--line);border-radius:var(--r);
  text-align:center;color:var(--dim);font-size:12px;display:none}
body.dnd .dz{display:block}
body.dnd .dz.over{border-color:var(--green);color:var(--green);background:rgba(80,250,123,.08)}

.pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;align-items:center}
.pill{display:flex;align-items:center;gap:5px;background:var(--bg2);border:1px solid var(--line);
  border-radius:20px;padding:2px 4px 2px 10px}
.pill .pn{color:var(--pink);font-size:11.5px;white-space:nowrap}
.pill input[type=text]{padding:1px 6px;font-size:11px;border-radius:12px;background:var(--bg3)}
.pill button{padding:0 5px;border:0;background:transparent;color:var(--dim);border-radius:50%}
.pill button:hover{color:var(--red);background:var(--bg4)}
.cond{display:flex;align-items:center;gap:5px;margin-top:8px;padding:6px 7px;
  background:rgba(241,250,140,.06);border:1px solid rgba(241,250,140,.25);border-radius:6px;flex-wrap:wrap}
.cond .cap{font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--yellow)}
.cond input[type=text]{min-width:70px}
.empty{color:var(--dim);text-align:center;padding:34px 22px;font-size:12px;line-height:2}
.empty b{color:var(--fg)}

/* ---------- output ---------- */
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto}
.tab{padding:7px 13px;cursor:pointer;font-size:11px;text-transform:uppercase;
  letter-spacing:.5px;color:var(--dim);border-bottom:2px solid transparent}
.tab:hover{color:var(--fg)}
.tab.on{color:var(--purple);border-bottom-color:var(--purple);background:var(--bg3)}
pre.code{margin:0;padding:12px;white-space:pre;overflow:auto;font-size:12px;line-height:1.65;tab-size:2}
.k{color:var(--pink)}.s{color:var(--yellow)}.c{color:var(--dim);font-style:italic}
.n{color:var(--purple)}
.pane{display:none;height:100%;overflow:auto}
.pane.on{display:block}
.secttl{padding:10px 12px 4px;color:var(--dim);font-size:10.5px;
  text-transform:uppercase;letter-spacing:.6px}
.diffline{padding:1px 12px;white-space:pre-wrap;word-break:break-all;font-size:12px}
.diffline.add{background:rgba(80,250,123,.12);border-left:3px solid var(--green)}
.diffline.same{border-left:3px solid transparent;color:var(--dim)}
.err{color:var(--red);padding:12px;white-space:pre-wrap}

/* ---------- recipes modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,21,28,.75);z-index:80;display:none;
  align-items:center;justify-content:center;padding:26px}
.overlay.on{display:flex}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:10px;width:min(940px,100%);
  max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
.modal header{background:var(--bg2)}
.modal .body{overflow:auto;padding:12px 14px}
.cats{display:flex;gap:6px;flex-wrap:wrap;padding:9px 14px;background:var(--bg3);
  border-bottom:1px solid var(--line)}
.cat{padding:3px 10px;border-radius:14px;border:1px solid var(--line);color:var(--dim);
  cursor:pointer;font-size:11.5px}
.cat:hover{color:var(--fg)}
.cat.on{background:var(--purple);border-color:var(--purple);color:#21222c;font-weight:600}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.rcard{border:1px solid var(--line);border-radius:var(--r);background:var(--bg3);padding:10px;
  display:flex;flex-direction:column;gap:6px}
.rcard:hover{border-color:var(--purple)}
.rcard .rt{color:var(--fg);font-weight:600;font-size:12.5px}
.rcard .rd{color:var(--dim);font-size:11.5px;line-height:1.5}
.rcard .rs{background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:5px 7px;
  font-size:11px;color:var(--cyan);white-space:pre-wrap;word-break:break-word;line-height:1.6}
.rcard .rs em{color:var(--pink);font-style:normal}
.rcard .rf{display:flex;align-items:center;gap:6px;margin-top:auto}
.tag{font-size:10px;padding:1px 6px;border-radius:9px;background:var(--bg2);
  border:1px solid var(--line);color:var(--dim)}

.arm{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:60;
  background:var(--green);color:#21222c;padding:6px 16px;border-radius:20px;
  font-weight:600;font-size:12px;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.toast{position:fixed;top:12px;right:12px;background:var(--green);color:#21222c;
  padding:7px 15px;border-radius:6px;font-weight:600;z-index:99;font-size:12px;
  box-shadow:0 4px 16px rgba(0,0,0,.4)}
</style>
</head>
<body>
<header>
  <h1>HL7 Interface <span>Javascript Builder</span></h1>
  <span class="badge">HL7 v2.5.1</span>
  <span class="spacer"></span>
  <button id="recipeBtn" class="primary">&#9733; Recipes</button>
  <button id="addRule">+ Mapping</button>
  <button id="saveBtn" class="sm ghost">Save</button>
  <button id="loadBtn" class="sm ghost">Load</button>
  <button id="clearBtn" class="sm ghost danger">Clear</button>
</header>

<div id="main">
  <!-- ---------- source ---------- -->
  <div class="col">
    <div class="colhead"><b>1.</b> Source message</div>
    <div class="subbar">
      <select id="sampleSel" style="flex:1" title="Load a sample message"></select>
      <button id="editMsg" class="sm" title="Show / hide the raw message">&#9998; Edit</button>
    </div>
    <div id="msgWrap" style="flex:0 0 auto;border-bottom:1px solid var(--line);display:none">
      <textarea id="msgIn" rows="7" spellcheck="false"
        style="border:0;border-radius:0;background:var(--bg3)"></textarea>
    </div>
    <div class="subbar">
      <input type="text" id="treeFind" placeholder="Filter fields…  e.g. name, PID-5, MRN">
      <label class="chk"><input type="checkbox" id="showEmpty"> empty</label>
      <button id="collapseAll" class="sm" title="Collapse / expand all segments">&#9776;</button>
    </div>
    <div class="colbody" id="tree"></div>
  </div>

  <!-- ---------- mappings ---------- -->
  <div class="col">
    <div class="colhead"><b>2.</b> Mappings
      <span class="spacer"></span>
      <span id="ruleCount" style="text-transform:none"></span></div>
    <div class="colbody" id="rules"></div>
  </div>

  <!-- ---------- output ---------- -->
  <div class="col">
    <div class="colhead"><b>3.</b> Output</div>
    <div class="tabs">
      <div class="tab on" data-p="js">JavaScript</div>
      <div class="tab" data-p="xml">Channel XML</div>
      <div class="tab" data-p="prev">Preview</div>
      <div class="spacer"></div>
      <div class="tab" id="copyBtn" style="color:var(--green)">Copy</div>
    </div>
    <div class="colbody">
      <div class="pane on" id="pane-js"><pre class="code" id="outJs"></pre></div>
      <div class="pane" id="pane-xml"><pre class="code" id="outXml"></pre></div>
      <div class="pane" id="pane-prev"><div id="outPrev"></div></div>
    </div>
  </div>
</div>

<!-- ---------- recipes ---------- -->
<div class="overlay" id="overlay">
  <div class="modal">
    <header>
      <h1>&#9733; <span>Transformer recipes</span></h1>
      <span class="badge" id="recipeCount"></span>
      <span class="spacer"></span>
      <input type="text" id="recipeFind" placeholder="Search recipes…" style="width:200px">
      <button id="closeModal" class="sm">Close</button>
    </header>
    <div class="cats" id="cats"></div>
    <div class="body"><div class="rgrid" id="rgrid"></div></div>
  </div>
</div>

<div id="armBar"></div>
<script>
/* ============================================================
   HL7 v2.5.1 data dictionary
   Field entries are "Name" or "Name:DATATYPE".
   ============================================================ */
const DT = {
  HD:['Namespace ID','Universal ID','Universal ID Type'],
  MSG:['Message Code','Trigger Event','Message Structure'],
  PT:['Processing ID','Processing Mode'],
  VID:['Version ID','Internationalization Code','Intl Version ID'],
  TS:['Time','Degree Of Precision'],
  EI:['Entity Identifier','Namespace ID','Universal ID','Universal ID Type'],
  CX:['ID Number','Check Digit','Check Digit Scheme','Assigning Authority','Identifier Type Code','Assigning Facility','Effective Date','Expiration Date'],
  XPN:['Family Name','Given Name','Middle Name','Suffix','Prefix','Degree','Name Type Code','Name Rep Code'],
  XCN:['ID Number','Family Name','Given Name','Middle Name','Suffix','Prefix','Degree','Source Table','Assigning Authority','Name Type Code'],
  XAD:['Street Address','Other Designation','City','State/Province','Zip Code','Country','Address Type','Other Geographic','County'],
  XTN:['Telephone Number','Telecom Use Code','Equipment Type','Email Address','Country Code','Area/City Code','Local Number','Extension'],
  XON:['Organization Name','Name Type Code','ID Number','Check Digit','Check Digit Scheme','Assigning Authority','Identifier Type Code'],
  CE :['Identifier','Text','Coding System','Alt Identifier','Alt Text','Alt Coding System'],
  CWE:['Identifier','Text','Coding System','Alt Identifier','Alt Text','Alt Coding System','Version ID','Alt Version ID','Original Text'],
  PL :['Point Of Care','Room','Bed','Facility','Location Status','Person Location Type','Building','Floor','Description'],
  DR :['Range Start Date/Time','Range End Date/Time'],
  CQ :['Quantity','Units'],
  FN :['Surname','Own Surname Prefix','Own Surname','Surname Prefix From Partner','Surname From Partner']
};

const SEG = {
MSH:{d:'Message Header',f:['Field Separator','Encoding Characters','Sending Application:HD','Sending Facility:HD','Receiving Application:HD','Receiving Facility:HD','Date/Time Of Message:TS','Security','Message Type:MSG','Message Control ID','Processing ID:PT','Version ID:VID','Sequence Number','Continuation Pointer','Accept Ack Type','Application Ack Type','Country Code','Character Set','Principal Language','Alt Char Set Handling','Conformance Statement ID']},
EVN:{d:'Event Type',f:['Event Type Code','Recorded Date/Time:TS','Date/Time Planned Event:TS','Event Reason Code','Operator ID:XCN','Event Occurred:TS','Event Facility:HD']},
PID:{d:'Patient Identification',f:['Set ID','Patient ID:CX','Patient Identifier List:CX','Alternate Patient ID:CX','Patient Name:XPN','Mother’s Maiden Name:XPN','Date/Time Of Birth:TS','Administrative Sex','Patient Alias:XPN','Race:CE','Patient Address:XAD','County Code','Phone Number - Home:XTN','Phone Number - Business:XTN','Primary Language:CE','Marital Status:CE','Religion:CE','Patient Account Number:CX','SSN Number','Driver’s License Number','Mother’s Identifier:CX','Ethnic Group:CE','Birth Place','Multiple Birth Indicator','Birth Order','Citizenship:CE','Veterans Military Status:CE','Nationality:CE','Patient Death Date/Time:TS','Patient Death Indicator','Identity Unknown Indicator','Identity Reliability Code','Last Update Date/Time:TS','Last Update Facility:HD','Species Code:CE','Breed Code:CE','Strain','Production Class Code:CE','Tribal Citizenship:CWE']},
PD1:{d:'Patient Demographic',f:['Living Dependency','Living Arrangement','Patient Primary Facility:XON','Patient Primary Care Provider:XCN','Student Indicator','Handicap','Living Will Code','Organ Donor Code','Separate Bill','Duplicate Patient:CX','Publicity Code:CE','Protection Indicator']},
NK1:{d:'Next Of Kin',f:['Set ID','Name:XPN','Relationship:CE','Address:XAD','Phone Number:XTN','Business Phone Number:XTN','Contact Role:CE','Start Date','End Date','Next Of Kin Job Title','Next Of Kin Job Code','Next Of Kin Employee Number','Organization Name:XON']},
PV1:{d:'Patient Visit',f:['Set ID','Patient Class','Assigned Patient Location:PL','Admission Type','Preadmit Number:CX','Prior Patient Location:PL','Attending Doctor:XCN','Referring Doctor:XCN','Consulting Doctor:XCN','Hospital Service','Temporary Location:PL','Preadmit Test Indicator','Re-admission Indicator','Admit Source','Ambulatory Status','VIP Indicator','Admitting Doctor:XCN','Patient Type','Visit Number:CX','Financial Class','Charge Price Indicator','Courtesy Code','Credit Rating','Contract Code','Contract Effective Date','Contract Amount','Contract Period','Interest Code','Transfer To Bad Debt Code','Transfer To Bad Debt Date','Bad Debt Agency Code','Bad Debt Transfer Amount','Bad Debt Recovery Amount','Delete Account Indicator','Delete Account Date','Discharge Disposition','Discharged To Location','Diet Type:CE','Servicing Facility','Bed Status','Account Status','Pending Location:PL','Prior Temporary Location:PL','Admit Date/Time:TS','Discharge Date/Time:TS','Current Patient Balance','Total Charges','Total Adjustments','Total Payments','Alternate Visit ID:CX','Visit Indicator','Other Healthcare Provider:XCN']},
PV2:{d:'Patient Visit Add’l',f:['Prior Pending Location:PL','Accommodation Code:CE','Admit Reason:CE','Transfer Reason:CE','Patient Valuables','Patient Valuables Location','Visit User Code','Expected Admit Date/Time:TS','Expected Discharge Date/Time:TS','Estimated Length Of Stay','Actual Length Of Stay','Visit Description','Referral Source Code:XCN']},
ORC:{d:'Common Order',f:['Order Control','Placer Order Number:EI','Filler Order Number:EI','Placer Group Number:EI','Order Status','Response Flag','Quantity/Timing','Parent Order','Date/Time Of Transaction:TS','Entered By:XCN','Verified By:XCN','Ordering Provider:XCN','Enterer’s Location:PL','Call Back Phone Number:XTN','Order Effective Date/Time:TS','Order Control Code Reason:CE','Entering Organization:CE','Entering Device:CE','Action By:XCN','Advanced Beneficiary Notice Code:CE','Ordering Facility Name:XON','Ordering Facility Address:XAD','Ordering Facility Phone:XTN','Ordering Provider Address:XAD']},
OBR:{d:'Observation Request',f:['Set ID','Placer Order Number:EI','Filler Order Number:EI','Universal Service Identifier:CE','Priority','Requested Date/Time:TS','Observation Date/Time:TS','Observation End Date/Time:TS','Collection Volume:CQ','Collector Identifier:XCN','Specimen Action Code','Danger Code:CE','Relevant Clinical Info','Specimen Received Date/Time:TS','Specimen Source','Ordering Provider:XCN','Order Callback Phone Number:XTN','Placer Field 1','Placer Field 2','Filler Field 1','Filler Field 2','Results Rpt/Status Chng:TS','Charge To Practice','Diagnostic Serv Sect ID','Result Status','Parent Result','Quantity/Timing','Result Copies To:XCN','Parent','Transportation Mode','Reason For Study:CE','Principal Result Interpreter:XCN','Assistant Result Interpreter:XCN','Technician:XCN','Transcriptionist:XCN','Scheduled Date/Time:TS','Number Of Sample Containers','Transport Logistics Of Specimen:CE','Collector’s Comment:CE','Transport Arrangement Responsibility:CE','Transport Arranged','Escort Required','Planned Patient Transport Comment:CE','Procedure Code:CE','Procedure Code Modifier:CE']},
OBX:{d:'Observation/Result',f:['Set ID','Value Type','Observation Identifier:CE','Observation Sub-ID','Observation Value','Units:CE','References Range','Abnormal Flags','Probability','Nature Of Abnormal Test','Observation Result Status','Effective Date Of Reference Range:TS','User Defined Access Checks','Date/Time Of The Observation:TS','Producer’s ID:CE','Responsible Observer:XCN','Observation Method:CE','Equipment Instance Identifier:EI','Date/Time Of The Analysis:TS']},

/* ============================================================
   HL7 parse / serialize / path access
   ============================================================ */
function parseHL7(text){
  const lines = text.replace(/\r\n/g,'\r').replace(/\n/g,'\r').split('\r')
                    .map(l=>l.trim()).filter(l=>l.length>2);
  return lines.map(line=>{
    const fields = line.split('|');
    const name = fields[0];
    return {name, fields, reps: fields.map(f=>f.split('~').map(r=>r.split('^')))};
  });
}
function serializeHL7(segs){
  return segs.map(s=>{
    const out = s.reps.map(reps => reps.map(c=>c.join('^')).join('~'));
    out[0] = s.name;
    if(s.name==='MSH') out[1] = s.fields[1];
    let arr = out.slice();
    while(arr.length>1 && arr[arr.length-1]==='') arr.pop();
    return arr.join('|');
  }).join('\r\n');
}
/* Index into the fields array. MSH.1 is the separator itself; MSH.n -> fields[n-1]. */
function fieldIndex(segName, fieldNo){ return segName==='MSH' ? fieldNo-1 : fieldNo; }

const PATH_RE = /^([A-Z][A-Z0-9]{2})(?:\[(\d+)\])?-(\d+)(?:\[(\d+)\])?(?:\.(\d+))?$/;
function parsePath(str){
  const m = PATH_RE.exec((str||'').trim().toUpperCase().replace(/\s/g,''));
  if(!m) return null;
  return {seg:m[1], segIdx:+(m[2]||0), field:+m[3], rep:+(m[4]||0),
          comp:m[5]?+m[5]:0};
}
function pathStr(p){
  return p.seg + (p.segIdx?'['+p.segIdx+']':'') + '-' + p.field +
         (p.rep?'['+p.rep+']':'') + (p.comp?'.'+p.comp:'');
}
function fieldLabel(seg, fieldNo, comp){
  const s = SEG[seg]; if(!s) return '';
  if(seg==='MSH' && fieldNo===1) return 'Field Separator';
  const raw = s.f[fieldNo-1]; if(!raw) return '';
  const [nm, dt] = raw.split(':');
  if(!comp) return nm;
  const list = dt && DT[dt];
  return (list && list[comp-1]) ? list[comp-1] : nm+' comp '+comp;
}
function fieldDatatype(seg, fieldNo){
  const s = SEG[seg]; if(!s) return null;
  const raw = s.f[fieldNo-1]; if(!raw) return null;
  return raw.split(':')[1] || null;
}

/* read a value out of a parsed message */
function readPath(segs, p){
  if(!p) return '';
  const matches = segs.filter(s=>s.name===p.seg);
  const seg = matches[p.segIdx]; if(!seg) return '';
  if(p.seg==='MSH' && p.field===1) return '|';
  if(p.seg==='MSH' && p.field===2) return seg.fields[1]||'';
  const fi = fieldIndex(p.seg, p.field);
  const reps = seg.reps[fi]; if(!reps) return '';
  const rep = reps[p.rep]; if(!rep) return '';
  if(!p.comp) return rep.join('^');
  return rep[p.comp-1] || '';
}
/* write a value into a parsed message, growing arrays as needed */
function writePath(segs, p, val){
  if(!p) return;
  let matches = segs.filter(s=>s.name===p.seg);
  let seg = matches[p.segIdx];
  if(!seg){
    seg = {name:p.seg, fields:[p.seg], reps:[[[p.seg]]]};
    segs.push(seg);
  }
  const fi = fieldIndex(p.seg, p.field);
  while(seg.reps.length <= fi) seg.reps.push([['']]);
  while(seg.reps[fi].length <= p.rep) seg.reps[fi].push(['']);
  if(!p.comp){ seg.reps[fi][p.rep] = String(val).split('^'); }
  else {
    const rep = seg.reps[fi][p.rep];
    while(rep.length < p.comp) rep.push('');
    rep[p.comp-1] = String(val);
  }
  if(p.seg==='MSH') seg.fields[1] = seg.fields[1] || '^~\\&';
}

/* ============================================================
   Mirth E4X path expressions
   ============================================================ */
function e4xNode(p){
  let s = "msg['"+p.seg+"']";
  if(p.segIdx) s += '['+p.segIdx+']';
  s += "['"+p.seg+'.'+p.field+"']";
  if(p.rep) s += '['+p.rep+']';
  if(p.comp) s += "['"+p.seg+'.'+p.field+'.'+p.comp+"']";
  return s;
}
function e4xRead(p){ return '_v('+e4xNode(p)+')'; }

/* ============================================================
   Transform catalog — each has a code generator and a live runner
   ============================================================ */
const A = (k,l,d,w)=>({k,l,d:d===undefined?'':d,w:w||70});
const XF = {
  upper:      {l:'Uppercase',      a:[], js:x=>x+'.toUpperCase()',            run:v=>v.toUpperCase()},
  lower:      {l:'Lowercase',      a:[], js:x=>x+'.toLowerCase()',            run:v=>v.toLowerCase()},
  trim:       {l:'Trim',           a:[], js:x=>x+'.replace(/^\\s+|\\s+$/g,\'\')', run:v=>v.trim()},
  titleCase:  {l:'Title Case',     a:[], js:x=>'_title('+x+')',               run:v=>v.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase())},
  substring:  {l:'Substring',      a:[A('start','from','0',52),A('end','to','',52)],
               js:(x,a)=>x+'.substring('+(+a.start||0)+(a.end!==''?','+(+a.end):'')+')',
               run:(v,a)=>a.end!==''?v.substring(+a.start||0,+a.end):v.substring(+a.start||0)},
  truncate:   {l:'Truncate to',    a:[A('len','chars','10',52)],
               js:(x,a)=>x+'.substring(0,'+(+a.len||0)+')', run:(v,a)=>v.substring(0,+a.len||0)},
  replace:    {l:'Replace',        a:[A('find','find','',80),A('with','with','',80)],
               js:(x,a)=>x+'.replace(/'+rxEsc(a.find)+'/g,'+q(a.with)+')',
               run:(v,a)=>a.find===''?v:v.split(a.find).join(a.with)},
  regex:      {l:'Regex extract',  a:[A('pat','pattern','(.*)',120),A('grp','group','1',48)],
               js:(x,a)=>'_rx('+x+','+q(a.pat)+','+(+a.grp||1)+')',
               run:(v,a)=>{try{const m=new RegExp(a.pat).exec(v);return m?(m[+a.grp||1]||''):'';}catch(e){return '';}}},
  digits:     {l:'Digits only',    a:[], js:x=>x+'.replace(/[^0-9]/g,\'\')',  run:v=>v.replace(/[^0-9]/g,'')},
  padLeft:    {l:'Pad left',       a:[A('len','len','10',48),A('ch','char','0',44)],
               js:(x,a)=>'_pad('+x+','+(+a.len||0)+','+q(a.ch||'0')+',true)',
               run:(v,a)=>pad(v,+a.len||0,a.ch||'0',true)},
  padRight:   {l:'Pad right',      a:[A('len','len','10',48),A('ch','char',' ',44)],
               js:(x,a)=>'_pad('+x+','+(+a.len||0)+','+q(a.ch||' ')+',false)',
               run:(v,a)=>pad(v,+a.len||0,a.ch||' ',false)},
  prefix:     {l:'Prefix with',    a:[A('t','text','',120)], js:(x,a)=>q(a.t)+' + '+x, run:(v,a)=>a.t+v},
  suffix:     {l:'Suffix with',    a:[A('t','text','',120)], js:(x,a)=>x+' + '+q(a.t), run:(v,a)=>v+a.t},
  dateFormat: {l:'Reformat date',  a:[A('i','from','yyyyMMddHHmmss',130),A('o','to','MM/dd/yyyy',110)],
               js:(x,a)=>'DateUtil.convertDate('+q(a.i)+','+q(a.o)+','+x+')',
               run:(v,a)=>convDate(v,a.i,a.o)},
  lookup:     {l:'Lookup table',   a:[A('map','A=1, B=2 ...',   '',190),A('def','if no match','',90)],
               js:null, run:(v,a)=>{const t=parseTable(a.map);return (v in t)?t[v]:(a.def!==''?a.def:v);}},
  fallback:   {l:'Default if empty',a:[A('t','value','',130)],
               js:(x,a)=>'('+x+' || '+q(a.t)+')', run:(v,a)=>v===''?a.t:v}
};
function q(s){ return "'" + String(s===undefined?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n') + "'"; }
function rxEsc(s){ return String(s||'').replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&'); }
function pad(v,n,c,left){ v=String(v); c=c||' ';
  while(v.length<n) v = left ? c+v : v+c; return v; }
function parseTable(t){
  const o={};
  String(t||'').split(/[,\n]/).forEach(pair=>{
    const i = pair.indexOf('=');
    if(i>0) o[pair.slice(0,i).trim()] = pair.slice(i+1).trim();
  });
  return o;
}
/* minimal strptime/strftime over yyyy MM dd HH mm ss SSS */
const TOK = /(yyyy|yy|MM|dd|HH|mm|ss|SSS)/g;
function convDate(v, inF, outF){
  v = String(v||''); if(!v) return '';
  const parts={yyyy:'',MM:'',dd:'',HH:'00',mm:'00',ss:'00',SSS:'000'};
  let pos=0, m; TOK.lastIndex=0;
  let last=0;
  while((m=TOK.exec(inF))!==null){
    pos += (m.index-last); last = m.index + m[0].length;
    const len = m[0].length;
    parts[m[0]] = v.substr(pos,len); pos += len;
  }
  if(parts.yy && !parts.yyyy) parts.yyyy = (+parts.yy>50?'19':'20')+parts.yy;
  parts.yy = parts.yyyy.slice(2);
  return outF.replace(TOK, t=>parts[t]!==undefined?parts[t]:t);
}

let RULES = [];
let SEGS  = [];
let uid   = 1;
const $ = s=>document.querySelector(s);

function newRule(){
  return {id:uid++, on:true,
    src:{kind:'field', path:'', text:''},
    xf:[],
    tgt:{kind:'field', path:'', name:''},
    cond:{on:false, path:'', op:'eq', val:''}};
}

/* ============================================================
   Code generation
   ============================================================ */
function tmplParts(text){
  const out=[]; const re=/\$\{([^}]+)\}/g; let last=0,m;
  while((m=re.exec(text))!==null){
    if(m.index>last) out.push({lit:text.slice(last,m.index)});
    const p = parsePath(m[1]);
    out.push(p?{path:p}:{lit:m[0]});
    last = m.index+m[0].length;
  }
  if(last<text.length) out.push({lit:text.slice(last)});
  return out;
}
function srcExpr(r, need){
  const s=r.src;
  if(s.kind==='literal') return q(s.text);
  if(s.kind==='var')     return "_v(channelMap.get("+q(s.text)+"))";
  if(s.kind==='now')     return "DateUtil.getCurrentDate('yyyyMMddHHmmss')";
  if(s.kind==='uuid')    return "UUIDGenerator.getUUID()";
  if(s.kind==='template'){
    need.v=true;
    const parts=tmplParts(s.text);
    if(!parts.length) return "''";
    return parts.map(p=>p.lit!==undefined?q(p.lit):e4xRead(p.path)).join(' + ');
  }
  const p=parsePath(s.path);
  if(!p) return "''";
  need.v=true;
  return e4xRead(p);
}
function condExpr(r, need){
  const p=parsePath(r.cond.path); if(!p) return null;
  need.v=true;
  const a=e4xRead(p), v=q(r.cond.val);
  switch(r.cond.op){
    case 'eq':  return a+' == '+v;
    case 'ne':  return a+' != '+v;
    case 'has': return a+'.indexOf('+v+') > -1';
    case 'sw':  return a+'.indexOf('+v+') == 0';
    case 'mt':  return 'new RegExp('+v+').test('+a+')';
    case 'empty':    return a+" == ''";
    case 'notempty': return a+" != ''";
  }
  return null;
}
function generate(){
  const need={v:false,pad:false,rx:false,title:false};
  const tables=[]; const body=[];
  let n=0;
  RULES.forEach(r=>{
    if(!r.on) return;
    n++;
    const tgtOk = r.tgt.kind==='field'||r.tgt.kind==='clear' ? !!parsePath(r.tgt.path) : !!r.tgt.name;
    if(!tgtOk){ body.push('// ['+n+'] skipped — no target set'); body.push(''); return; }

    let expr;
    if(r.tgt.kind==='clear'){ expr="''"; }
    else{
      expr = srcExpr(r, need);
      r.xf.forEach((t,i)=>{
        const def=XF[t.fn]; if(!def) return;
        if(t.fn==='lookup'){
          const tn='LOOKUP_'+n+'_'+(i+1);
          const tbl=parseTable(t.a.map);
          tables.push('var '+tn+' = {'+Object.keys(tbl).map(k=>'\n  '+q(k)+': '+q(tbl[k])).join(',')+'\n};');
          expr='(function(_x){ return (_x in '+tn+') ? '+tn+'[_x] : '+
               (t.a.def!==''?q(t.a.def):'_x')+'; })('+expr+')';
        } else {
          if(t.fn==='padLeft'||t.fn==='padRight') need.pad=true;
          if(t.fn==='regex') need.rx=true;
          if(t.fn==='titleCase') need.title=true;
          expr = def.js(expr, t.a||{});
        }
      });
    }

    let assign;
    if(r.tgt.kind==='channelMap')       assign='channelMap.put('+q(r.tgt.name)+', '+expr+');';
    else if(r.tgt.kind==='connectorMap')assign='connectorMap.put('+q(r.tgt.name)+', '+expr+');';
    else                                assign=e4xNode(parsePath(r.tgt.path))+' = '+expr+';';

    body.push('// ['+n+'] '+ruleTitle(r));
    const c=r.cond.on ? condExpr(r,need) : null;
    if(c){ body.push('if ('+c+') {'); body.push('  '+assign); body.push('}'); }
    else  { body.push(assign); }
    body.push('');
  });

  const head=[
    '/* -----------------------------------------------------------',
    '   Mirth Connect transformer  —  HL7 v2.5.1',
    '   Generated '+new Date().toISOString().slice(0,19).replace('T',' '),
    '   Inbound & outbound data type: HL7 v2.x',
    '   Paste into a JavaScript transformer step.',
    '   Note: assigning to a field that is absent from the inbound',
    '   message appends it at the end of the segment. Add the field',
    '   to the outbound template if strict ordering matters.',
    '   ----------------------------------------------------------- */',''];
  const help=[];
  if(need.v)     help.push("function _v(node) {\n  return (node === undefined || node === null) ? '' : node.toString();\n}");
  if(need.pad)   help.push("function _pad(s, len, ch, left) {\n  s = String(s);\n  while (s.length < len) { s = left ? ch + s : s + ch; }\n  return s;\n}");
  if(need.rx)    help.push("function _rx(s, pattern, group) {\n  var m = new RegExp(pattern).exec(String(s));\n  return m ? (m[group] || '') : '';\n}");
  if(need.title) help.push("function _title(s) {\n  return String(s).toLowerCase().replace(/\\b[a-z]/g, function(c){ return c.toUpperCase(); });\n}");

  if(!n) return head.join('\n')+'\n// No enabled mappings yet.\n'+
    '// Drag a field onto another field, or open the Recipes library.';
  let out = head.join('\n');
  if(help.length) out += '// ---- helpers ----\n'+help.join('\n\n')+'\n\n';
  if(tables.length) out += '// ---- lookup tables ----\n'+tables.join('\n')+'\n\n';
  out += '// ---- mappings ----\n'+body.join('\n').replace(/\n+$/,'')+'\n\nreturn;';
  return out;
}
function generateXML(){
  const js = generate();
  const esc = s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return ['<transformer version="4.5.0">',
  '  <elements>',
  '    <com.mirth.connect.plugins.javascriptstep.JavaScriptStep version="4.5.0">',
  '      <name>Generated Mappings</name>',
  '      <sequenceNumber>0</sequenceNumber>',
  '      <enabled>true</enabled>',
  '      <scr'+'ipt>'+esc(js)+'</scr'+'ipt>',
  '    </com.mirth.connect.plugins.javascriptstep.JavaScriptStep>',
  '  </elements>',
  '  <inboundTemplate encoding="base64"></inboundTemplate>',
  '  <outboundTemplate encoding="base64"></outboundTemplate>',
  '  <inboundDataType>HL7V2</inboundDataType>',
  '  <outboundDataType>HL7V2</outboundDataType>',
  '</transformer>'].join('\n');
}

/* ============================================================
   Live preview — runs the same mappings in the browser
   ============================================================ */
function runPreview(){
  const src = parseHL7($('#msgIn').value);
  const out = JSON.parse(JSON.stringify(src));
  const maps = {};
  const errs = [];
  RULES.forEach((r,i)=>{
    if(!r.on) return;
    try{
      if(r.cond.on){
        const cp=parsePath(r.cond.path);
        const a = cp ? readPath(src, cp) : '';
        const b = r.cond.val;
        let ok=false;
        switch(r.cond.op){
          case 'eq': ok = a===b; break;
          case 'ne': ok = a!==b; break;
          case 'has':ok = a.indexOf(b)>-1; break;
          case 'sw': ok = a.indexOf(b)===0; break;
          case 'mt': ok = new RegExp(b).test(a); break;
          case 'empty': ok = a===''; break;
          case 'notempty': ok = a!==''; break;
        }
        if(!ok) return;
      }
      let val='';
      if(r.tgt.kind==='clear') val='';
      else{
        const s=r.src;
        if(s.kind==='literal') val=s.text;
        else if(s.kind==='var') val=maps[s.text]!==undefined?maps[s.text]:'';
        else if(s.kind==='now') val=new Date().toISOString().replace(/[-:T]/g,'').slice(0,14);
        else if(s.kind==='uuid') val='xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
          const rr=Math.random()*16|0; return (c==='x'?rr:(rr&3|8)).toString(16); });
        else if(s.kind==='template')
          val = tmplParts(s.text).map(p=>p.lit!==undefined?p.lit:readPath(src,p.path)).join('');
        else val = readPath(src, parsePath(s.path));
        r.xf.forEach(t=>{ const d=XF[t.fn]; if(d) val = d.run(String(val), t.a||{}); });
      }
      if(r.tgt.kind==='channelMap'||r.tgt.kind==='connectorMap') maps[r.tgt.name]=val;
      else writePath(out, parsePath(r.tgt.path), val);
    }catch(e){ errs.push('Mapping '+(i+1)+': '+e.message); }
  });
  return {text:serializeHL7(out), before:serializeHL7(src), maps, errs};
}

/* ============================================================
   Recipe library — common Mirth transformer patterns
   ============================================================ */
function mk(s){
  const r = newRule();
  if(s.lit   !== undefined){ r.src.kind='literal';  r.src.text=s.lit; }
  else if(s.tmpl !== undefined){ r.src.kind='template'; r.src.text=s.tmpl; }
  else if(s.varIn!== undefined){ r.src.kind='var';      r.src.text=s.varIn; }
  else if(s.now)  r.src.kind='now';
  else if(s.uuid) r.src.kind='uuid';
  else if(s.from !== undefined){ r.src.kind='field'; r.src.path=s.from; }

  if(s.clear !== undefined){ r.tgt.kind='clear'; r.tgt.path=s.clear; }
  else if(s.toVar !== undefined){ r.tgt.kind='channelMap';   r.tgt.name=s.toVar; }
  else if(s.toConn!== undefined){ r.tgt.kind='connectorMap'; r.tgt.name=s.toConn; }
  else if(s.to    !== undefined){ r.tgt.kind='field';        r.tgt.path=s.to; }

  (s.xf||[]).forEach(function(pair){
    const fn=pair[0], over=pair[1]||{}, def=XF[fn]; if(!def) return;
    const a={}; def.a.forEach(x=>a[x.k]=x.d); Object.assign(a,over);
    r.xf.push({fn:fn, a:a});
  });
  if(s.when) r.cond={on:true, path:s.when[0], op:s.when[1], val:s.when[2]===undefined?'':s.when[2]};
  return r;
}

let COLLAPSED = {}, SHOW_EMPTY = false, FILTER = '', DRAG = null, CAT = 'All', RFIND = '';
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ruleTitle(r){
  const s=r.src, t=r.tgt;
  let a;
  if(t.kind==='clear') a='clear';
  else if(s.kind==='literal') a='"'+(s.text||'')+'"';
  else if(s.kind==='template') a=s.text||'template';
  else if(s.kind==='var') a='var '+s.text;
  else if(s.kind==='now') a='timestamp';
  else if(s.kind==='uuid') a='UUID';
  else a=s.path||'?';
  const b = (t.kind==='channelMap'?'channelMap.'+t.name
           : t.kind==='connectorMap'?'connectorMap.'+t.name
           : t.path||'?');
  const xs = r.xf.length ? ' ('+r.xf.map(x=>XF[x.fn]?XF[x.fn].l:x.fn).join(' \u2192 ')+')' : '';
  return a+xs+'  \u2192  '+b;
}
function pathHint(str){
  const p=parsePath(str||''); if(!p) return '';
  const l=fieldLabel(p.seg,p.field,p.comp);
  return l ? l+(SEG[p.seg]?' \u00b7 '+SEG[p.seg].d:'') : (SEG[p.seg]?SEG[p.seg].d:'');
}

function slotHTML(r, which){

      val='<input type="text" class="pathin" data-f="src.path" value="'+esc(o.path)+'" placeholder="drop a field, or type PID-5.1">';

      val='<span style="color:var(--dim);font-size:11.5px">generated when the channel runs</span>';
      meta = o.kind==='now' ? 'DateUtil.getCurrentDate' : 'UUIDGenerator.getUUID';

      meta = o.kind==='template' ? 'use ${SEG-field.comp} to embed fields' : '';

      meta='read it later with '+(o.kind==='channelMap'?'channelMap':'connectorMap')+'.get()';
    }
  }
  const takesField = isSrc ? o.kind==='field' : (o.kind==='field'||o.kind==='clear');
  return '<div class="slot '+which+'" data-slot="'+which+'"'+(takesField?' data-drop="1"':'')+'>'+

    '<div class="meta">'+esc(meta)+'</div></div>';
}

/* ---------- source tree ---------- */
function renderTree(){
  SEGS = parseHL7($('#msgIn').value);
  const f = FILTER.toLowerCase();
  const html = SEGS.map((seg,si)=>{
    const idx = SEGS.filter((s,k)=>s.name===seg.name && k<si).length;
    const def = SEG[seg.name];
    const rows=[];
    const start = seg.name==='MSH' ? 2 : 1;
    const max = seg.reps.length + (seg.name==='MSH'?1:0);
    for(let fl=start; fl<max; fl++){
      const fi=fieldIndex(seg.name,fl);
      const reps = seg.reps[fi]||[['']];
      if(seg.name==='MSH' && fl===2){
        rows.push(node({seg:'MSH',segIdx:idx,field:2,rep:0,comp:0},
                       'Encoding Characters', seg.fields[1]||'', false, f));
        continue;
      }
      reps.forEach((comps,ri)=>{
        const rp = reps.length>1 ? ri : 0;
        const val = comps.join('^');
        if(val==='' && !SHOW_EMPTY) return;
        const p = {seg:seg.name,segIdx:idx,field:fl,rep:rp,comp:0};
        rows.push(node(p, fieldLabel(seg.name,fl,0), val, false, f));
        if(comps.length>1) comps.forEach((c,ci)=>{
          if(c==='' && !SHOW_EMPTY) return;
          rows.push(node({seg:seg.name,segIdx:idx,field:fl,rep:rp,comp:ci+1},
                         fieldLabel(seg.name,fl,ci+1), c, true, f));
        });
      });
    }
    const kept = rows.filter(Boolean);
    if(!kept.length && f) return '';
    const open = !COLLAPSED[si] || !!f;
    return '<div class="seg"><div class="segbar" data-seg="'+si+'">'+
      '<span class="caret">'+(open?'\u25be':'\u25b8')+'</span>'+
      '<span class="nm">'+esc(seg.name)+(idx?'['+idx+']':'')+'</span>'+
      '<span class="desc">'+esc(def?def.d:'custom segment')+'</span></div>'+
      '<div class="segfields"'+(open?'':' style="display:none"')+'>'+kept.join('')+'</div></div>';
  }).join('');
  $('#tree').innerHTML = html ||
    '<div class="empty">'+(FILTER?'Nothing matches that filter.':'Paste an HL7 message to get started.')+'</div>';
}
function node(p,label,val,isComp,f){
  const ps=pathStr(p);
  if(f && (ps+' '+(label||'')+' '+val).toLowerCase().indexOf(f)===-1) return '';
  return '<div class="node'+(isComp?' comp':'')+'" draggable="true" data-path="'+ps+'" title="drag onto a target field, or click to map">'+
    '<span class="path">'+ps+'</span>'+
    '<span class="lbl">'+esc(label||'')+'</span>'+
    '<span class="val">'+esc(val)+'</span></div>';
}

/* ---------- recipes ---------- */
function recipeSummary(rec){ const u=uid, s=rec.build().map(ruleTitle); uid=u; return s; }
function renderRecipes(){
  const cats=['All'].concat(RECIPES.map(r=>r.cat).filter((c,i,a)=>a.indexOf(c)===i));
  $('#cats').innerHTML = cats.map(c=>'<span class="cat'+(c===CAT?' on':'')+'" data-cat="'+c+'">'+c+
    (c==='All'?' ('+RECIPES.length+')':'')+'</span>').join('');
  const q=RFIND.toLowerCase();
  const list = RECIPES.filter(r=>(CAT==='All'||r.cat===CAT) &&
    (!q || (r.name+' '+r.desc+' '+r.tags+' '+r.cat).toLowerCase().indexOf(q)>-1));
  $('#recipeCount').textContent = list.length+' shown';
  $('#rgrid').innerHTML = list.length ? list.map(r=>{
    const i = RECIPES.indexOf(r);
    return '<div class="rcard">'+
      '<div class="rt">'+esc(r.name)+'</div>'+
      '<div><span class="tag">'+esc(r.cat)+'</span> <span class="tag">'+esc(r.tags)+'</span></div>'+
      '<div class="rd">'+esc(r.desc)+'</div>'+
      '<div class="rs">'+recipeSummary(r).map(s=>esc(s)).join('<br>')+'</div>'+
      '<div class="rf"><button class="primary sm" data-add="'+i+'">+ Add '+
        recipeSummary(r).length+' mapping'+(recipeSummary(r).length>1?'s':'')+'</button>'+
        '<span class="spacer"></span></div></div>';
  }).join('') : '<div class="empty">No recipes match that search.</div>';
}

/* ---------- output ---------- */
function highlight(code){
  return esc(code).replace(
    /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|('(?:\\.|[^'\\])*')|\b(var|function|return|if|else|new|delete|typeof)\b|\b(msg|channelMap|connectorMap|DateUtil|UUIDGenerator|logger)\b/g,
    (m,c,s,k,n)=> c?'<span class="c">'+c+'</span>'
                 : s?'<span class="s">'+s+'</span>'
                 : k?'<span class="k">'+k+'</span>'
                 : '<span class="n">'+n+'</span>');
}
function renderOut(){
  $('#outJs').innerHTML  = highlight(generate());
  $('#outXml').textContent = generateXML();
  const r = runPreview();
  const before = r.before.split('\r\n'), after = r.text.split('\r\n');
  const changed = after.filter((l,i)=>before[i]!==l).length;
  let h='';
  if(r.errs.length) h+='<div class="err">'+esc(r.errs.join('\n'))+'</div>';
  h += '<div class="secttl">Transformed message'+
       (changed?' \u00b7 <span style="color:var(--green)">'+changed+' segment'+(changed>1?'s':'')+' changed</span>':' \u00b7 no changes')+'</div>';
  h += after.map((l,i)=>'<div class="diffline '+(before[i]===l?'same':'add')+'">'+esc(l)+'</div>').join('');
  const keys=Object.keys(r.maps);
  if(keys.length){
    h+='<div class="secttl">Variables</div>';
    h+=keys.map(k=>'<div class="diffline"><span style="color:var(--orange)">'+esc(k)+
       '</span> = <span style="color:var(--green)">'+esc(r.maps[k])+'</span></div>').join('');
  }
  $('#outPrev').innerHTML=h;
}
function render(){ renderRules(); renderOut(); }

/* ============================================================
   Events
   ============================================================ */
let ARM = null, OVER = null;
function byId(id){ return RULES.find(r=>r.id===id); }
function el(t){ return t && t.nodeType===1 ? t : (t && t.parentElement); }
function ruleOf(n){ const c=el(n) && el(n).closest('.rule'); return c?byId(+c.dataset.id):null; }
function setDeep(r,path,val){
  const b=path.split('.'); if(b.length===1) r[b[0]]=val; else r[b[0]][b[1]]=val;
}
function toast(m){
  const d=document.createElement('div'); d.className='toast'; d.textContent=m;
  document.body.appendChild(d); setTimeout(()=>d.remove(),1500);
}
function setArm(a){
  ARM=a; const bar=$('#armBar');
  if(!a){ bar.innerHTML=''; document.querySelectorAll('.node.picked').forEach(n=>n.classList.remove('picked')); return; }
  const what = a.which==='tgt'?'TARGET':a.which==='cond'?'CONDITION':'SOURCE';
  bar.innerHTML='<div class="arm">Click the '+what+' field in the message  ·  Esc to cancel</div>';
}
function addRules(list, note){
  RULES = RULES.concat(list); render();
  if(note) toast(note);
  const last=$('#rules').querySelector('.rule:last-of-type');
  if(last) last.scrollIntoView({block:'nearest'});
}

/* ---------------- drag and drop ---------------- */
function clearDnd(){
  document.body.classList.remove('dnd');
  document.querySelectorAll('.over,.rover,.dragging,.rdrag')
    .forEach(n=>n.classList.remove('over','rover','dragging','rdrag'));
  OVER=null;
}
document.addEventListener('dragstart', e=>{
  const t=el(e.target); if(!t) return;
  const g=t.closest('.grip');
  if(g){
    const r=ruleOf(g); if(!r) return;
    DRAG={kind:'rule', id:r.id};
    e.dataTransfer.effectAllowed='move';
    e.dataTransfer.setData('text/plain','rule:'+r.id);
    g.closest('.rule').classList.add('rdrag');
    return;
  }
  const n=t.closest('.node');
  if(n){
    DRAG={kind:'node', path:n.dataset.path};
    e.dataTransfer.effectAllowed='copy';
    e.dataTransfer.setData('text/plain', n.dataset.path);
    n.classList.add('dragging');
    document.body.classList.add('dnd');
    setArm(null);
  }
});
document.addEventListener('dragover', e=>{
  if(!DRAG) return;
  const t=el(e.target); if(!t) return;
  const hit = DRAG.kind==='node'
    ? t.closest('.slot[data-drop], .dz, .node')
    : t.closest('.rule');
  if(!hit) return;
  if(DRAG.kind==='node' && hit.classList.contains('node') && hit.dataset.path===DRAG.path) return;
  if(DRAG.kind==='rule' && +hit.dataset.id===DRAG.id) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = DRAG.kind==='rule' ? 'move' : 'copy';
  if(OVER && OVER!==hit) OVER.classList.remove('over','rover');
  OVER=hit; hit.classList.add(DRAG.kind==='rule'?'rover':'over');
});
document.addEventListener('dragleave', e=>{
  const t=el(e.target);
  if(OVER && t===OVER){ OVER.classList.remove('over','rover'); OVER=null; }
});
document.addEventListener('drop', e=>{
  if(!DRAG) return;
  e.preventDefault();
  const t=OVER, d=DRAG;
  clearDnd(); DRAG=null;
  if(!t) return;

  if(d.kind==='rule'){
    const from=RULES.findIndex(r=>r.id===d.id), to=RULES.findIndex(r=>r.id===+t.dataset.id);
    if(from<0||to<0||from===to) return;
    const moved=RULES.splice(from,1)[0];
    RULES.splice(to,0,moved); render(); return;
  }
  if(t.classList.contains('node')){
    const r=newRule(); r.src.path=d.path; r.tgt.path=t.dataset.path;
    addRules([r], d.path+' → '+t.dataset.path);
    return;
  }
  if(t.classList.contains('dz')){
    const r=newRule(); r.src.path=d.path; addRules([r]);
    setArm({id:r.id, which:'tgt'});
    return;
  }
  const r=ruleOf(t); if(!r) return;
  if(t.dataset.slot==='src'){ r.src.kind='field'; r.src.path=d.path; }
  else { if(r.tgt.kind!=='field' && r.tgt.kind!=='clear') r.tgt.kind='field'; r.tgt.path=d.path; }
  render();
});
document.addEventListener('dragend', ()=>{ clearDnd(); DRAG=null; });

/* ---------------- mapping cards ---------------- */
$('#rules').addEventListener('input', e=>{
  const r=ruleOf(e.target); if(!r) return;
  const f=e.target.dataset.f, xa=e.target.dataset.xa;
  if(f) setDeep(r, f, e.target.type==='checkbox'?e.target.checked:e.target.value);
  else if(xa){ const b=xa.split(':'); r.xf[+b[0]].a[b[1]]=e.target.value; }
  else return;
  renderOut();
  const card=e.target.closest('.rule');
  const ttl=card.querySelector('.ttl'); if(ttl) ttl.textContent=ruleTitle(r);
  const slot=e.target.closest('.slot');
  if(slot && e.target.classList.contains('pathin')){
    const m=slot.querySelector('.meta'); if(m) m.textContent=pathHint(e.target.value);
  }
});
$('#rules').addEventListener('change', e=>{
  const r=ruleOf(e.target); if(!r) return;
  if(e.target.dataset.addxf!==undefined){
    const fn=e.target.value; if(!fn) return;
    const a={}; XF[fn].a.forEach(x=>a[x.k]=x.d);
    r.xf.push({fn:fn,a:a}); render(); return;
  }
  const f=e.target.dataset.f;
  if(f==='src.kind'||f==='tgt.kind'||f==='cond.op'||f==='on'){
    setDeep(r,f,e.target.type==='checkbox'?e.target.checked:e.target.value); render();
  }
});
$('#rules').addEventListener('click', e=>{
  const b=el(e.target) && el(e.target).closest('button'); if(!b) return;
  const r=ruleOf(b); if(!r) return;
  const d=b.dataset;
  if(d.pick!==undefined){ setArm({id:r.id, which:d.pick}); return; }
  if(d.xdel!==undefined){ r.xf.splice(+d.xdel,1); render(); return; }
  if(d.xmove!==undefined){
    const p=d.xmove.split(':'), j=+p[0], k=j+ +p[1];
    if(k<0||k>=r.xf.length) return;
    const tmp=r.xf[j]; r.xf[j]=r.xf[k]; r.xf[k]=tmp; render(); return;
  }
  if(d.cond!==undefined){ r.cond.on = d.cond==='on'; render(); return; }
  if(d.act==='del'){ RULES=RULES.filter(x=>x.id!==r.id); render(); return; }
  if(d.act==='dup'){
    const c=JSON.parse(JSON.stringify(r)); c.id=uid++;
    RULES.splice(RULES.indexOf(r)+1,0,c); render(); return;
  }
  if(d.act==='up'){
    const i=RULES.indexOf(r); if(i<1) return;
    RULES.splice(i,1); RULES.splice(i-1,0,r); render();
  }
});

/* ---------------- source tree ---------------- */
$('#tree').addEventListener('click', e=>{
  const t=el(e.target); if(!t) return;
  const bar=t.closest('.segbar');
  if(bar){
    const si=bar.dataset.seg, box=bar.nextElementSibling;
    COLLAPSED[si]=!COLLAPSED[si];
    box.style.display = COLLAPSED[si] ? 'none' : '';
    bar.querySelector('.caret').textContent = COLLAPSED[si] ? '▸' : '▾';
    return;
  }
  const n=t.closest('.node'); if(!n) return;
  const path=n.dataset.path;
  if(ARM){
    const r=byId(ARM.id);
    if(r){
      if(ARM.which==='src'){ r.src.kind='field'; r.src.path=path; }
      else if(ARM.which==='tgt'){
        if(r.tgt.kind!=='field' && r.tgt.kind!=='clear') r.tgt.kind='field';
        r.tgt.path=path;
      } else r.cond.path=path;
    }
    setArm(null); render();
  } else {
    const r=newRule(); r.src.path=path; addRules([r]);
    setArm({id:r.id, which:'tgt'});
    n.classList.add('picked');
  }
});
$('#treeFind').addEventListener('input', e=>{ FILTER=e.target.value; renderTree(); });
$('#showEmpty').addEventListener('change', e=>{ SHOW_EMPTY=e.target.checked; renderTree(); });
$('#collapseAll').onclick = ()=>{
  const anyOpen = SEGS.some((s,i)=>!COLLAPSED[i]);
  SEGS.forEach((s,i)=>COLLAPSED[i]=anyOpen);
  renderTree();
};
$('#editMsg').onclick = ()=>{
  const w=$('#msgWrap'); w.style.display = w.style.display==='none' ? '' : 'none';
};
$('#msgIn').addEventListener('input', ()=>{
  clearTimeout(window._t);
  window._t=setTimeout(()=>{ renderTree(); renderOut(); },350);
});

/* ---------------- recipes ---------------- */
function openRecipes(){ renderRecipes(); $('#overlay').classList.add('on'); $('#recipeFind').focus(); }
$('#recipeBtn').onclick = openRecipes;
$('#closeModal').onclick = ()=>$('#overlay').classList.remove('on');
$('#overlay').addEventListener('click', e=>{ if(e.target===$('#overlay')) $('#overlay').classList.remove('on'); });
$('#recipeFind').addEventListener('input', e=>{ RFIND=e.target.value; renderRecipes(); });
$('#cats').addEventListener('click', e=>{
  const c=el(e.target) && el(e.target).closest('.cat'); if(!c) return;
  CAT=c.dataset.cat; renderRecipes();
});
$('#rgrid').addEventListener('click', e=>{
  const b=el(e.target) && el(e.target).closest('[data-add]'); if(!b) return;
  const rec=RECIPES[+b.dataset.add];
  addRules(rec.build(), 'Added: '+rec.name);
  $('#overlay').classList.remove('on');
});

/* ---------------- header, tabs, storage ---------------- */
$('#addRule').onclick = ()=>addRules([newRule()]);
$('#clearBtn').onclick = ()=>{ if(RULES.length && confirm('Delete all '+RULES.length+' mappings?')){ RULES=[]; render(); } };
$('#saveBtn').onclick = ()=>{
  localStorage.setItem('mirthMapper', JSON.stringify({rules:RULES, msg:$('#msgIn').value}));
  toast('Saved to this browser');
};
$('#loadBtn').onclick = ()=>{
  const raw=localStorage.getItem('mirthMapper');
  if(!raw){ toast('Nothing saved yet'); return; }
  const d=JSON.parse(raw);
  RULES=d.rules||[]; uid=RULES.reduce((m,r)=>Math.max(m,r.id),0)+1;
  if(d.msg) $('#msgIn').value=d.msg;
  renderTree(); render(); toast('Loaded '+RULES.length+' mappings');
};
document.querySelectorAll('.tab[data-p]').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab[data-p]').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); $('#pane-'+t.dataset.p).classList.add('on');
});
$('#copyBtn').onclick = ()=>{
  const on=document.querySelector('.tab.on[data-p]').dataset.p;
  const txt = on==='xml' ? generateXML() : on==='js' ? generate() : runPreview().text;
  navigator.clipboard.writeText(txt).then(()=>toast('Copied'),()=>toast('Copy blocked'));
};
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ setArm(null); $('#overlay').classList.remove('on'); }
});

/* ---------------- init ---------------- */
const sel=$('#sampleSel');
Object.keys(SAMPLES).forEach(k=>{
  const o=document.createElement('option'); o.value=k; o.textContent=k; sel.appendChild(o);
});
sel.onchange = ()=>{ $('#msgIn').value=SAMPLES[sel.value]; COLLAPSED={}; renderTree(); renderOut(); };
$('#msgIn').value = SAMPLES[Object.keys(SAMPLES)[0]];
renderTree(); render();
</script>
</body>
